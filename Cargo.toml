[package]
name = "metamatch-backend"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.1"
description = "Non-custodial EVM quote competition backend"
license = "UNLICENSED"

[dependencies]
alloy-primitives = { version = "1.7", features = ["serde"] }
alloy-provider = { version = "2.4", default-features = false, features = ["reqwest", "reqwest-rustls-tls", "rpc-api"] }
alloy-rpc-types-eth = { version = "2.4", default-features = false, features = ["serde"] }
alloy-sol-types = "1.7"
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
